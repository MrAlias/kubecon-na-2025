[package]
name = "users"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "users"
path = "src/main.rs"
