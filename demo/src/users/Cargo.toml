[package]
name = "users"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libsql = { version = "0.3", default-features = false, features = ["remote"] }
log = "0.4"
env_logger = "0.10"

[[bin]]
name = "users"
path = "src/main.rs"
